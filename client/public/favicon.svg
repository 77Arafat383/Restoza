<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#881337" />
      <stop offset="100%" stop-color="#28000B" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Rounded Shield -->
  <rect x="6" y="6" width="108" height="108" rx="28" fill="url(#bgGrad)" stroke="url(#goldGrad)" stroke-width="2.5" />

  <!-- Inner Gold Trim Ring -->
  <rect x="12" y="12" width="96" height="96" rx="22" fill="none" stroke="#F59E0B" stroke-opacity="0.25" stroke-width="1.5" stroke-dasharray="4 2" />

  <!-- Culinary Flame Top Crest -->
  <path d="M60 22 C58 26, 54 28, 54 32 C54 35.5, 56.5 38, 60 38 C63.5 38, 66 35.5, 66 32 C66 28, 62 26, 60 22 Z" fill="url(#goldGrad)" />
  <circle cx="60" cy="40" r="3.5" fill="url(#goldGrad)" />

  <!-- Cloche Dome Arch -->
  <path d="M30 64 C30 46, 42 38, 60 38 C78 38, 90 46, 90 64 Z" fill="none" stroke="url(#goldGrad)" stroke-width="4.5" stroke-linecap="round" />
  
  <!-- Cloche Platter Base -->
  <path d="M22 68 C22 68, 25 71, 32 71 L88 71 C95 71, 98 68, 98 68" fill="none" stroke="url(#goldGrad)" stroke-width="4.5" stroke-linecap="round" />
  <line x1="28" y1="75" x2="92" y2="75" stroke="url(#goldGrad)" stroke-width="3" stroke-linecap="round" />

  <!-- Crossed Cutlery Emblem (Fork and Knife) -->
  <!-- Knife -->
  <path d="M48 55 L72 88 M48 55 C46 52, 49 48, 52 51 L72 88" fill="none" stroke="#FDE68A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
  <!-- Fork -->
  <path d="M72 55 L48 88 M68 53 L74 59 M65 56 L71 62" fill="none" stroke="#FDE68A" stroke-width="2.5" stroke-linecap="round" />
</svg>